name: Python API Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest pyyaml flask

    - name: Start Mock API in background
      run: |
        python mock_api.py &
        sleep 5

    - name: Run Pytest
      run: |
        pytest api_automation/test_api.py -v
